<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f4f0;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2c2c2c;
      color: #fff;
      padding: 14px 24px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    .left {
      width: 320px;
      min-width: 260px;
      background: #fff;
      border-right: 1px solid #e0ddd6;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .left-top {
      padding: 16px;
      border-bottom: 1px solid #e0ddd6;
    }

    .left-top h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 12px; }

    .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .form-row input, .form-row select { flex: 1; }

    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #fafafa;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #2c2c2c; background: #fff; }

    textarea { resize: vertical; min-height: 70px; margin-bottom: 8px; }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }
    .btn-dark  { background: #2c2c2c; color: #fff; width: 100%; }
    .btn-dark:hover { background: #444; }
    .btn-sm    { padding: 4px 10px; font-size: 0.8rem; }
    .btn-ghost { background: transparent; border: 1px solid #ddd; color: #555; }
    .btn-ghost:hover { background: #f0ede8; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }

    .entries-list { flex: 1; overflow-y: auto; }

    .entry-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f0ede8;
      cursor: pointer;
      transition: background 0.1s;
    }
    .entry-item:hover { background: #f9f7f4; }
    .entry-item.active { background: #f0ede8; border-left: 3px solid #2c2c2c; }

    .entry-item-date { font-size: 0.75rem; color: #999; margin-bottom: 2px; }
    .entry-item-title { font-weight: 600; font-size: 0.9rem; }
    .entry-item-mood { font-size: 0.75rem; color: #888; margin-top: 2px; }

    .empty { padding: 24px 16px; color: #aaa; font-size: 0.85rem; text-align: center; }

    /* ── RIGHT PANEL ── */
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 0.95rem;
    }

    .detail {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #e0ddd6;
      background: #fff;
    }

    .detail-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-title { font-size: 1.4rem; font-weight: 700; }
    .detail-meta  { font-size: 0.82rem; color: #999; margin-top: 4px; }
    .detail-content { margin-top: 10px; font-size: 0.9rem; line-height: 1.6; color: #444; white-space: pre-wrap; }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .todos-heading {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 12px;
    }

    .todo-add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .todo-add-row input { flex: 1; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: #fff;
      border: 1px solid #e8e5e0;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .todo-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #2c2c2c; }

    .todo-label {
      flex: 1;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .todo-label.done { text-decoration: line-through; color: #aaa; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2c2c2c;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>📓 Journal App</header>

<div class="layout">

  <div class="left">
    <div class="left-top">
      <h2>New Entry</h2>
      <input type="text" id="new-title" placeholder="Title" style="margin-bottom:8px" />
      <div class="form-row">
        <input type="date" id="new-date" />
        <select id="new-mood">
          <option value="">Mood…</option>
          <option value="happy">😊 Happy</option>
          <option value="neutral">😐 Neutral</option>
          <option value="sad">😔 Sad</option>
          <option value="anxious">😰 Anxious</option>
          <option value="excited">🤩 Excited</option>
        </select>
      </div>
      <textarea id="new-content" placeholder="Write your thoughts…"></textarea>
      <button class="btn btn-dark" onclick="createEntry()">Add Entry</button>
    </div>
    <div class="entries-list" id="entries-list">
      <div class="empty">No entries yet.</div>
    </div>
  </div>

  <div class="right" id="right">
    <div class="placeholder">← Select an entry to view it</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const API = '/api';
  let selectedEntryId = null;
  let entries = [];


  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function fmt(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function api(method, path, body) {
    const res = await fetch(API + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }


  async function loadEntries() {
    entries = await api('GET', '/entries');
    renderEntryList();
  }

  function renderEntryList() {
    const el = document.getElementById('entries-list');
    if (!entries.length) {
      el.innerHTML = '<div class="empty">No entries yet.</div>';
      return;
    }
    el.innerHTML = entries.map(e => `
      <div class="entry-item ${e.id === selectedEntryId ? 'active' : ''}" onclick="selectEntry('${e.id}')">
        <div class="entry-item-date">${fmt(e.date)}</div>
        <div class="entry-item-title">${escHtml(e.title)}</div>
        ${e.mood ? `<div class="entry-item-mood">${moodLabel(e.mood)}</div>` : ''}
      </div>
    `).join('');
  }

  function moodLabel(m) {
    return { happy:'😊 Happy', neutral:'😐 Neutral', sad:'😔 Sad', anxious:'😰 Anxious', excited:'🤩 Excited' }[m] || m;
  }

  async function createEntry() {
    const title = document.getElementById('new-title').value.trim();
    if (!title) { toast('Title is required'); return; }
    const date  = document.getElementById('new-date').value;
    const mood  = document.getElementById('new-mood').value;
    const content = document.getElementById('new-content').value.trim();
    await api('POST', '/entries', { title, content, date: date || undefined, mood: mood || undefined });
    document.getElementById('new-title').value = '';
    document.getElementById('new-content').value = '';
    document.getElementById('new-date').value = '';
    document.getElementById('new-mood').value = '';
    toast('Entry created');
    await loadEntries();
  }

  async function selectEntry(id) {
    selectedEntryId = id;
    renderEntryList();
    await renderDetail();
  }

  async function deleteEntry(id) {
    if (!confirm('Delete this entry and all its todos?')) return;
    await api('DELETE', `/entries/${id}`);
    selectedEntryId = null;
    document.getElementById('right').innerHTML = '<div class="placeholder">← Select an entry to view it</div>';
    toast('Entry deleted');
    await loadEntries();
  }


  async function renderDetail() {
    const entry = entries.find(e => e.id === selectedEntryId);
    if (!entry) return;
    const todos = await api('GET', `/entries/${selectedEntryId}/todos`);

    document.getElementById('right').innerHTML = `
      <div class="detail">
        <div class="detail-header">
          <div class="detail-header-row">
            <div>
              <div class="detail-title">${escHtml(entry.title)}</div>
              <div class="detail-meta">${fmt(entry.date)}${entry.mood ? ' · ' + moodLabel(entry.mood) : ''}</div>
            </div>
            <button class="btn btn-sm btn-danger" onclick="deleteEntry('${entry.id}')">Delete entry</button>
          </div>
          ${entry.content ? `<div class="detail-content">${escHtml(entry.content)}</div>` : ''}
        </div>

        <div class="detail-body">
          <div class="todos-heading">To-Do List</div>

          <div class="todo-add-row">
            <input type="text" id="todo-input" placeholder="Add a task…" onkeydown="if(event.key==='Enter') addTodo()" />
            <button class="btn btn-ghost btn-sm" onclick="addTodo()">Add</button>
          </div>

          <div id="todo-list">
            ${todos.length === 0
              ? '<div class="empty" style="text-align:left;padding:0;color:#bbb">No tasks yet.</div>'
              : todos.map(t => todoHtml(t)).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function todoHtml(t) {
    return `
      <div class="todo-item" id="todo-${t.id}">
        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo('${t.id}', this.checked)" />
        <span class="todo-label ${t.completed ? 'done' : ''}">${escHtml(t.title)}</span>
        <button class="btn btn-sm btn-ghost" onclick="deleteTodo('${t.id}')">✕</button>
      </div>
    `;
  }

  async function addTodo() {
    const input = document.getElementById('todo-input');
    const title = input.value.trim();
    if (!title) return;
    const todo = await api('POST', `/entries/${selectedEntryId}/todos`, { title });
    input.value = '';
    const list = document.getElementById('todo-list');
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();
    list.insertAdjacentHTML('beforeend', todoHtml(todo));
  }

  async function toggleTodo(id, completed) {
    await api('PUT', `/todos/${id}`, { completed });
    const label = document.querySelector(`#todo-${id} .todo-label`);
    if (label) label.classList.toggle('done', completed);
  }

  async function deleteTodo(id) {
    await api('DELETE', `/todos/${id}`);
    document.getElementById(`todo-${id}`)?.remove();
  }


  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }


  loadEntries();
</script>
</body>
</html>
